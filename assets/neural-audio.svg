<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Guilherme Nogueira — systems, audio and digital preservation</title>
  <desc id="desc">An animated dark technical interface with circuit traces, processing nodes and an audio waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.55" stop-color="#17121f"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b0000" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e32636"/>
      <stop offset="1" stop-color="#a600b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b0000"/>
      <stop offset="0.5" stop-color="#e32636"/>
      <stop offset="1" stop-color="#a600b8"/>
    </linearGradient>
    <filter id="glow-red" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b9c0cc" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="2" cy="2" r="1" fill="#c8cdd6" fill-opacity=".18"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; letter-spacing: 2px; }
      .small { font-size: 11px; }
      .label { font-size: 15px; font-weight: 700; }
      .trace { fill: none; stroke: url(#line); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 12 18; animation: travel 4s linear infinite; }
      .trace.alt { animation-duration: 6s; animation-direction: reverse; opacity: .7; }
      .node { fill: #e32636; filter: url(#glow-red); }
      .node.purple { fill: #b923d1; }
      .node.green { fill: #12d98b; }
      .muted { fill: #9da6b5; }
      @keyframes travel { to { stroke-dashoffset: -120; } }
      @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(260px); } }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .sweep { animation: sweep 3.2s ease-in-out infinite alternate; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="url(#grid)" stroke="#3b263f" stroke-width="2"/>

  <g opacity=".42" filter="url(#glow-soft)">
    <circle cx="600" cy="148" r="86" fill="#8b0000"/>
    <circle cx="600" cy="148" r="52" fill="#65007e"/>
  </g>

  <g class="trace">
    <path d="M 38 70 H 185 L 225 110 H 340"/>
    <path d="M 38 230 H 190 L 235 190 H 340"/>
    <path d="M 1162 70 H 1015 L 975 110 H 860"/>
    <path d="M 1162 230 H 1010 L 965 190 H 860"/>
    <path d="M 340 110 H 420 L 455 145"/>
    <path d="M 860 110 H 780 L 745 145"/>
  </g>
  <g class="trace alt">
    <path d="M 105 40 V 88 L 150 133"/>
    <path d="M 1095 40 V 88 L 1050 133"/>
    <path d="M 105 260 V 212 L 150 167"/>
    <path d="M 1095 260 V 212 L 1050 167"/>
  </g>

  <g class="blink">
    <circle class="node" cx="38" cy="70" r="4"/>
    <circle class="node purple" cx="38" cy="230" r="4"/>
    <circle class="node green" cx="1162" cy="70" r="4"/>
    <circle class="node" cx="1162" cy="230" r="4"/>
    <circle class="node purple" cx="105" cy="40" r="4"/>
    <circle class="node green" cx="1095" cy="260" r="4"/>
  </g>

  <g transform="translate(600 148)">
    <circle r="84" fill="none" stroke="#dfe5ee" stroke-opacity=".12" stroke-width="1"/>
    <circle r="69" fill="none" stroke="#e32636" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="54" fill="#10131a" fill-opacity=".92" stroke="#e32636" stroke-width="2"/>
    <circle r="43" fill="none" stroke="#a600b8" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#e32636" filter="url(#glow-red)">
      <animate attributeName="r" values="7;11;7" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#e32636;#b923d1;#e32636" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text class="mono label" x="0" y="-7" text-anchor="middle" fill="#f3f5f8">SIGNAL</text>
    <text class="mono small" x="0" y="16" text-anchor="middle" fill="#12d98b">ONLINE</text>
  </g>

  <g class="mono">
    <text x="44" y="47" class="small muted">HARDWARE / SOFTWARE</text>
    <text x="44" y="267" class="small muted">JNI · C++ · JAVA</text>
    <text x="1016" y="47" class="small muted" text-anchor="end">NATIVE AUDIO / DSP</text>
    <text x="1156" y="267" class="small muted" text-anchor="end">STREAMING · ARCHIVE</text>
  </g>

  <g class="sweep" opacity=".72">
    <rect x="510" y="44" width="180" height="1" fill="#e32636"/>
    <rect x="545" y="255" width="110" height="1" fill="#a600b8"/>
  </g>

  <g transform="translate(405 246)">
    <rect x="0" y="-8" width="5" height="8" rx="2" fill="#8b0000"><animate attributeName="height" values="8;26;8" dur="1.1s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-26;-8" dur="1.1s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="13" y="-8" width="5" height="8" rx="2" fill="#a600b8"><animate attributeName="height" values="8;42;8" dur="1.1s" begin=".12s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-42;-8" dur="1.1s" begin=".12s" repeatCount="indefinite"/></rect>
    <rect x="26" y="-8" width="5" height="8" rx="2" fill="#e32636"><animate attributeName="height" values="8;22;8" dur="1.1s" begin=".24s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-22;-8" dur="1.1s" begin=".24s" repeatCount="indefinite"/></rect>
    <rect x="39" y="-8" width="5" height="8" rx="2" fill="#12d98b"><animate attributeName="height" values="8;34;8" dur="1.1s" begin=".36s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-34;-8" dur="1.1s" begin=".36s" repeatCount="indefinite"/></rect>
    <rect x="52" y="-8" width="5" height="8" rx="2" fill="#a600b8"><animate attributeName="height" values="8;18;8" dur="1.1s" begin=".48s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-18;-8" dur="1.1s" begin=".48s" repeatCount="indefinite"/></rect>
    <rect x="65" y="-8" width="5" height="8" rx="2" fill="#e32636"><animate attributeName="height" values="8;38;8" dur="1.1s" begin=".6s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-38;-8" dur="1.1s" begin=".6s" repeatCount="indefinite"/></rect>
    <rect x="78" y="-8" width="5" height="8" rx="2" fill="#12d98b"><animate attributeName="height" values="8;25;8" dur="1.1s" begin=".72s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-25;-8" dur="1.1s" begin=".72s" repeatCount="indefinite"/></rect>
    <rect x="91" y="-8" width="5" height="8" rx="2" fill="#a600b8"><animate attributeName="height" values="8;31;8" dur="1.1s" begin=".84s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-31;-8" dur="1.1s" begin=".84s" repeatCount="indefinite"/></rect>
    <rect x="104" y="-8" width="5" height="8" rx="2" fill="#e32636"><animate attributeName="height" values="8;20;8" dur="1.1s" begin=".96s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-20;-8" dur="1.1s" begin=".96s" repeatCount="indefinite"/></rect>
  </g>

  <path d="M 770 246 C 790 246 794 222 812 222 S 838 269 856 269 S 884 213 901 213 S 930 246 948 246" fill="none" stroke="url(#wave)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="287" class="mono small" text-anchor="middle" fill="#788394">BUILDING SYSTEMS THAT CARRY SIGNALS FORWARD</text>
</svg>